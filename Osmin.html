        <svg width="14" height="14" viewBox="0 0 14 14" fill={milestone ? 'var(--accent)' : 'none'} stroke={milestone ? 'var(--accent)' : 'var(--text-muted)'} strokeWidth="1.5">
          <path d="M7 1.5L8.7 5l3.8.5-2.8 2.6.7 3.8L7 10.1 3.6 12l.7-3.8L1.5 5.5 5.3 5z" strokeLinejoin="round"/>
        </svg>
      </button>
      <input
        value={value}
        onChange={e => onChange(e.target.value)}
        placeholder=""
        style={{
          flex: 1, minWidth: 0,
          border: 'none', outline: 'none', background: 'transparent',
          fontFamily: 'Inter, sans-serif', fontSize: 13.5,
          color: 'var(--text)',
          padding: '4px 0',
        }}
      />
    </div>
  );
}

Object.assign(window, { TableLayout });

</script>

<script type="text/babel">
// journal-layout.jsx — Layout B: mini-calendar grid + day-card journal stream

function MiniCalendar({ month, density, selectedDay, onSelectDay, todayDay }) {
  const firstDay = month.days[0].weekday; // 0=Sun
  // We render Mon-first European week
  const weekStartsMon = true;
  const offset = weekStartsMon ? (firstDay === 0 ? 6 : firstDay - 1) : firstDay;

  const cells = [];
  for (let i = 0; i < offset; i++) cells.push(null);
  for (const d of month.days) cells.push(d);
  while (cells.length % 7 !== 0) cells.push(null);

  const wdHeaders = weekStartsMon
    ? ['L', 'M', 'X', 'J', 'V', 'S', 'D']
    : ['D', 'L', 'M', 'X', 'J', 'V', 'S'];

  return (
    <div style={{
      background: 'var(--surface)',
      border: '1px solid var(--line)',
      borderRadius: 14,
      padding: 16,
    }}>
      <div style={{
        display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: 4,
        marginBottom: 8,
      }}>
        {wdHeaders.map((w, i) => (
          <div key={i} style={{
            textAlign: 'center',
            fontFamily: 'JetBrains Mono, monospace', fontSize: 10,
            color: 'var(--text-muted)', fontWeight: 600,
            textTransform: 'uppercase', letterSpacing: '0.06em',
          }}>{w}</div>
        ))}
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: 4 }}>
        {cells.map((d, i) => {
          if (!d) return <div key={i} />;
          const sel = selectedDay === d.day;
          const isToday = d.day === todayDay;
          const bg = d.status === 'holiday' ? 'var(--c-festivo)' :
                     d.status === 'vacation' ? 'var(--c-vacaciones)' : 'transparent';
          const habitDots = month.habits.map(h => {
            const v = d.habits[h.id];
            const ok = h.type === 'check' ? v === 1 : (v || 0) >= h.goal;
            return ok ? h.color : null;
          });
          return (
            <button
              key={i}
              onClick={() => onSelectDay(d.day)}
              style={{
                aspectRatio: '1',
                padding: 4,
                background: isToday && bg === 'transparent'
                  ? `color-mix(in oklab, var(--accent) 10%, var(--surface))`
                  : bg,
                border: sel ? '1.5px solid var(--text)'
                  : isToday ? '1.5px solid var(--accent)'
                  : '1px solid var(--line-soft)',
                borderRadius: 8,
                cursor: 'pointer',
                display: 'flex', flexDirection: 'column',
                alignItems: 'flex-start', justifyContent: 'space-between',
                position: 'relative',
              }}
            >
              <div style={{
                fontFamily: 'JetBrains Mono, monospace',
                fontSize: 12, fontWeight: 600,
                color: bg !== 'transparent' ? '#1a1a1a' : isToday ? 'var(--accent)' : 'var(--text)',
                fontVariantNumeric: 'tabular-nums',
              }}>{d.day}</div>
              {d.milestone && (
                <div style={{
                  position: 'absolute', top: 3, right: 3,
                  width: 6, height: 6, borderRadius: '50%', background: 'var(--accent)',
                }} />
              )}
              <div style={{ display: 'flex', gap: 2, flexWrap: 'wrap' }}>
                {habitDots.map((c, j) => (
                  <div key={j} style={{
                    width: 5, height: 5, borderRadius: '50%',
                    background: c || 'transparent',
                    border: c ? 'none' : '1px solid var(--line)',
                  }} />
                ))}
              </div>
            </button>
          );
        })}
      </div>
    </div>
  );
}

function DayCard({ day, habits, selected, isToday, onUpdate, onSelect }) {
  const wd = WEEKDAYS_LONG[day.weekday];
  const stColor = day.status === 'holiday' ? 'var(--c-festivo)' :
                  day.status === 'vacation' ? 'var(--c-vacaciones)' : 'transparent';

  return (
    <div
      onClick={onSelect}
      style={{
        background: isToday
          ? `color-mix(in oklab, var(--accent) 5%, var(--surface))`
          : 'var(--surface)',
        border: selected ? '1.5px solid var(--text)'
          : isToday ? '1.5px solid var(--accent)'
          : '1px solid var(--line)',
        borderRadius: 12,
        padding: '14px 16px',
        cursor: 'pointer',
        display: 'flex', gap: 14,
      }}
    >
      {/* date stub */}
      <div style={{
        flexShrink: 0, width: 48, display: 'flex',
        flexDirection: 'column', alignItems: 'center',
        paddingTop: 2, gap: 2,
      }}>
        <div style={{
          fontFamily: 'JetBrains Mono, monospace',
          fontSize: 26, fontWeight: 600, lineHeight: 1,
          fontVariantNumeric: 'tabular-nums',
          color: isToday ? 'var(--accent)' : 'var(--text)',
        }}>{String(day.day).padStart(2, '0')}</div>
        <div style={{
          fontFamily: 'JetBrains Mono, monospace', fontSize: 10,
          color: 'var(--text-muted)', textTransform: 'uppercase',
          letterSpacing: '0.08em',
        }}>{wd.slice(0, 3)}</div>
        {stColor !== 'transparent' && (
          <div style={{
            width: 24, height: 4, borderRadius: 2,
            background: stColor, marginTop: 4,
          }} />
        )}
      </div>

      {/* content */}
      <div style={{ flex: 1, minWidth: 0, display: 'flex', flexDirection: 'column', gap: 8 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
          {day.milestone && (
            <svg width="13" height="13" viewBox="0 0 14 14" fill="var(--accent)">
              <path d="M7 1.5L8.7 5l3.8.5-2.8 2.6.7 3.8L7 10.1 3.6 12l.7-3.8L1.5 5.5 5.3 5z"/>
            </svg>
          )}
          <input
            value={day.highlight}
            onChange={e => onUpdate({ highlight: e.target.value })}
            placeholder="Escribe el highlight del día…"
            onClick={e => e.stopPropagation()}
            style={{
              flex: 1, border: 'none', outline: 'none', background: 'transparent',
              fontFamily: 'Inter, sans-serif', fontSize: 14.5,
              color: day.highlight ? 'var(--text)' : 'var(--text-muted)',
              padding: 0,
            }}
          />
        </div>

        <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
          {habits.map(h => {
            const v = day.habits[h.id];
            const ok = h.type === 'check' ? v === 1 : (v || 0) >= h.goal;
            const tinted = (h.type === 'check' ? v === 1 : v > 0);
            return (
              <button
                key={h.id}
                onClick={e => {
                  e.stopPropagation();
                  if (h.type === 'check') {
                    onUpdate({ habits: { ...day.habits, [h.id]: cycleCheck(v) } });
                  } else {
                    const cur = v || 0;
                    const next = prompt(`${h.label} (meta: ${h.goal})`, String(cur));
                    if (next !== null) {
                      const n = parseInt(next.replace(/[^\d]/g, ''), 10);
                      onUpdate({ habits: { ...day.habits, [h.id]: isNaN(n) ? 0 : n } });
                    }
                  }
                }}
                style={{
                  display: 'inline-flex', alignItems: 'center', gap: 6,
                  padding: '4px 10px', borderRadius: 999,
                  border: `1px solid ${tinted ? h.color : 'var(--line)'}`,
                  background: tinted ? `color-mix(in oklab, ${h.color} ${ok ? 16 : 8}%, transparent)` : 'transparent',
                  fontFamily: 'Inter, sans-serif',
                  fontSize: 11.5, fontWeight: 500,
                  color: tinted ? 'var(--text)' : 'var(--text-muted)',
                  cursor: 'pointer',
                }}
              >
                <span style={{
                  width: 7, height: 7, borderRadius: '50%',
                  background: tinted ? h.color : 'var(--line-strong)',
                }} />
                <span>{h.short}</span>
                {h.type === 'numeric' && (
                  <span style={{
                    fontFamily: 'JetBrains Mono, monospace',
                    fontVariantNumeric: 'tabular-nums',
                    color: tinted ? 'var(--text)' : 'var(--text-muted)',
                  }}>
                    {v ? v.toLocaleString('es') : '—'}
                  </span>
                )}
                {v === -1 && <span style={{ fontSize: 10, color: 'var(--text-muted)' }}>skip</span>}
              </button>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function JournalLayout({ month, setMonth, density }) {
  const [selected, setSelected] = React.useState(null);
  const updateDay = (day, mut) => {
    setMonth(m => {
      const next = { ...m, days: m.days.slice() };
      const idx = day - 1;
      next.days[idx] = { ...next.days[idx], ...mut };
      return next;
    });
  };

  const _today = new Date();
  const todayDay = (month.year === _today.getFullYear() && month.month === _today.getMonth())
    ? _today.getDate() : null;

  return (
    <div style={{ display: 'grid', gridTemplateColumns: '320px 1fr', gap: 16, alignItems: 'flex-start' }}>
      <div style={{ position: 'sticky', top: 0 }}>
        <MiniCalendar month={month} density={density} selectedDay={selected} onSelectDay={setSelected} todayDay={todayDay} />
        <div style={{
          marginTop: 12, padding: 14,
          background: 'var(--surface)', border: '1px solid var(--line)', borderRadius: 14,
          fontFamily: 'Inter, sans-serif', fontSize: 11.5, color: 'var(--text-muted)',
          display: 'flex', flexDirection: 'column', gap: 8,
        }}>
          <div style={{ fontWeight: 600, color: 'var(--text)', marginBottom: 2 }}>Leyenda</div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
            <div style={{ width: 14, height: 10, borderRadius: 3, background: 'var(--c-festivo)' }} />
            <span>Festivo / fin de semana</span>
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
            <div style={{ width: 14, height: 10, borderRadius: 3, background: 'var(--c-vacaciones)' }} />
            <span>Vacaciones</span>
          </div>
          {month.habits.map(h => (
            <div key={h.id} style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
              <div style={{ width: 6, height: 6, borderRadius: '50%', background: h.color }} />
              <span>{h.label}</span>
            </div>
          ))}
        </div>
      </div>

      <div style={{ display: 'flex', flexDirection: 'column', gap: density === 'compact' ? 6 : 10 }}>
        {month.days.map(d => (
          <DayCard
            key={d.day}
            day={d}
            habits={month.habits}
            selected={selected === d.day}
            isToday={d.day === todayDay}
            onSelect={() => setSelected(d.day)}
            onUpdate={mut => updateDay(d.day, mut)}
          />
        ))}
      </div>
    </div>
  );
}

Object.assign(window, { JournalLayout });

</script>

<script type="text/babel">
// overview.jsx — Month overview: stats, milestones, editable goal checklist

function OverviewStatTile({ habit, month }) {
  const stats = habitStats(month, habit);
  const streak = habitStreak(month, habit);
  return (
    <div style={{
      flex: 1, minWidth: 0,
      background: 'var(--surface)',
      border: '1px solid var(--line)',
      borderRadius: 12,
      padding: '16px 18px',
      display: 'flex', flexDirection: 'column', gap: 10,
    }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
        <div style={{ width: 8, height: 8, borderRadius: '50%', background: habit.color }} />
        <div style={{ fontSize: 12, fontWeight: 600, color: 'var(--text)' }}>{habit.label}</div>
        <div style={{ flex: 1 }} />
        <div style={{
          fontFamily: 'JetBrains Mono, monospace', fontSize: 10.5,
          color: 'var(--text-muted)', fontVariantNumeric: 'tabular-nums',
        }}>
          {habit.type === 'numeric'
            ? `${habit.goal.toLocaleString('es')}/día`
            : (habit.targetPerWeek === 7 ? 'todos los días' : `${habit.targetPerWeek}/sem`)}
        </div>
      </div>
      <div style={{ display: 'flex', alignItems: 'baseline', gap: 8 }}>
        <div style={{
          fontFamily: 'Instrument Serif, serif', fontSize: 38, lineHeight: 1,
          color: 'var(--text)', fontVariantNumeric: 'tabular-nums',
        }}>
          {habit.type === 'numeric' ? stats.avg.toLocaleString('es') : stats.done}
        </div>
        <div style={{ fontFamily: 'JetBrains Mono, monospace', fontSize: 11, color: 'var(--text-muted)' }}>
          {habit.type === 'numeric' ? 'media/día' : `de ${stats.total}`}
        </div>
      </div>
      <div style={{ height: 4, borderRadius: 2, background: 'var(--line)', overflow: 'hidden' }}>
        <div style={{ width: `${stats.pct}%`, height: '100%', background: habit.color }} />
      </div>
      <div style={{
        display: 'flex', justifyContent: 'space-between',
        fontFamily: 'JetBrains Mono, monospace', fontSize: 10.5,
        color: 'var(--text-muted)', fontVariantNumeric: 'tabular-nums',
      }}>
        <span>{stats.pct}% cumplido</span>
        <span>racha {streak}d</span>
      </div>
    </div>
  );
}

function StarIcon({ filled = true, size = 14 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 14 14"
         fill={filled ? 'var(--accent)' : 'none'}
         stroke={filled ? 'var(--accent)' : 'var(--text-muted)'}
         strokeWidth="1.5" strokeLinejoin="round">
      <path d="M7 1.5L8.7 5l3.8.5-2.8 2.6.7 3.8L7 10.1 3.6 12l.7-3.8L1.5 5.5 5.3 5z" />
    </svg>
  );
}

function GoalRow({ goal, onChange, onDelete }) {
  return (
    <div style={{
      display: 'flex', alignItems: 'center', gap: 12,
      padding: '12px 14px',
      borderBottom: '1px solid var(--line-soft)',
    }}>
      <button
        onClick={() => onChange({ done: !goal.done })}
        style={{
          width: 22, height: 22, borderRadius: 6,
          border: `1.5px solid ${goal.done ? 'var(--accent)' : 'var(--line-strong)'}`,
          background: goal.done ? 'var(--accent)' : 'transparent',
          cursor: 'pointer', padding: 0, flexShrink: 0,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          transition: 'all 120ms',
        }}
      >
        {goal.done && (
          <svg width="12" height="12" viewBox="0 0 14 14" fill="none">
            <path d="M3 7.5L5.8 10L11 4.5" stroke="white" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" />
          </svg>
        )}
      </button>
      <input
        value={goal.text}
        onChange={e => onChange({ text: e.target.value })}
        placeholder="Escribe un objetivo del mes…"
        style={{
          flex: 1, border: 'none', outline: 'none', background: 'transparent',
          fontFamily: 'Inter, sans-serif', fontSize: 14.5,
          color: goal.done ? 'var(--text-muted)' : 'var(--text)',
          textDecoration: goal.done ? 'line-through' : 'none',
          padding: 0,
        }}
      />
      <button
        onClick={onDelete}
        title="Eliminar"
        style={{
          width: 22, height: 22, borderRadius: 6, border: 'none',
          background: 'transparent', cursor: 'pointer',
          color: 'var(--text-muted)', opacity: 0.5,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
        }}
      >
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
          <path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" />
        </svg>
      </button>
    </div>
  );
}

function GoalsChecklist({ month, setMonth }) {
  const goals = month.goals || [];
  const updateGoal = (id, mut) => setMonth(m => ({
    ...m, goals: m.goals.map(g => g.id === id ? { ...g, ...mut } : g),
  }));
  const deleteGoal = (id) => setMonth(m => ({ ...m, goals: m.goals.filter(g => g.id !== id) }));
  const addGoal = () => setMonth(m => ({
    ...m,
    goals: [...m.goals, { id: 'g' + Date.now(), text: '', done: false }],
  }));
  const done = goals.filter(g => g.done).length;
  const atLimit = goals.length >= 5;

  return (
    <div style={{
      background: 'var(--surface)',
      border: '1px solid var(--line)',
      borderRadius: 14,
      overflow: 'hidden',
    }}>
      <div style={{
        display: 'flex', alignItems: 'baseline', justifyContent: 'space-between',
        padding: '16px 18px 12px',
        borderBottom: '1px solid var(--line)',
      }}>
        <div>
          <h3 style={{
            margin: 0,
            fontFamily: 'Instrument Serif, serif', fontWeight: 400,
            fontSize: 22, color: 'var(--text)',
          }}>Hitos que me marco este mes</h3>
          <div style={{
            marginTop: 2,
            fontFamily: 'Inter, sans-serif', fontSize: 12,
            color: 'var(--text-muted)',
          }}>
            Define 4-5 objetivos principales y márcalos a lo largo del mes
          </div>
        </div>
        <div style={{
          fontFamily: 'JetBrains Mono, monospace',
          fontSize: 12, color: 'var(--text-muted)',
          fontVariantNumeric: 'tabular-nums',
        }}>{done}/{goals.length}</div>
      </div>

      <div>
        {goals.map(g => (
          <GoalRow
            key={g.id}
            goal={g}
            onChange={mut => updateGoal(g.id, mut)}
            onDelete={() => deleteGoal(g.id)}
          />
        ))}
      </div>

      <div style={{ padding: '10px 14px' }}>
        <button
          onClick={addGoal}
          disabled={atLimit}
          style={{
            display: 'flex', alignItems: 'center', gap: 8,
            padding: '8px 12px', borderRadius: 8,
            border: '1px dashed var(--line-strong)',
            background: 'transparent', cursor: atLimit ? 'not-allowed' : 'pointer',
            color: atLimit ? 'var(--text-muted)' : 'var(--text-soft)',
            fontFamily: 'Inter, sans-serif', fontSize: 12.5, fontWeight: 500,
            opacity: atLimit ? 0.5 : 1,
            width: '100%', justifyContent: 'center',
          }}
        >
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M6 2v8M2 6h8" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" />
          </svg>
          {atLimit ? 'Máximo 5 hitos' : 'Añadir hito'}
        </button>
      </div>
    </div>
  );
}

function MonthMilestones({ month }) {
  const ms = month.days.filter(d => d.milestone);
  return (
    <div style={{
      background: 'var(--surface)',
      border: '1px solid var(--line)',
      borderRadius: 14,
      padding: '16px 18px',
    }}>
      <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', marginBottom: 12 }}>
        <h3 style={{
          margin: 0, fontFamily: 'Instrument Serif, serif',
          fontWeight: 400, fontSize: 22, color: 'var(--text)',
        }}>Días destacados</h3>
        <div style={{
          fontFamily: 'Inter, sans-serif', fontSize: 11,
          color: 'var(--text-muted)',
        }}>marcados con ★ desde la vista mensual</div>
      </div>

      {ms.length === 0 ? (
        <div style={{
          padding: '24px 8px',
          textAlign: 'center',
          color: 'var(--text-muted)',
          fontSize: 13,
        }}>
          Aún no has marcado ningún día como destacado este mes.
        </div>
      ) : (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
          {ms.map(d => {
            const wd = WEEKDAYS_LONG[d.weekday];
            return (
              <div key={d.day} style={{
                display: 'flex', alignItems: 'center', gap: 14,
                padding: '10px 4px',
                borderBottom: '1px solid var(--line-soft)',
              }}>
                <StarIcon size={13} />
                <div style={{
                  fontFamily: 'JetBrains Mono, monospace',
                  fontSize: 13, color: 'var(--text)',
                  fontVariantNumeric: 'tabular-nums',
                  minWidth: 40,
                }}>{String(d.day).padStart(2, '0')}</div>
                <div style={{
                  fontFamily: 'Inter, sans-serif', fontSize: 11,
                  color: 'var(--text-muted)', textTransform: 'lowercase',
                  minWidth: 70,
                }}>{wd}</div>
                <div style={{
                  flex: 1,
                  fontFamily: 'Inter, sans-serif', fontSize: 14,
                  color: 'var(--text)', fontWeight: 500,
                }}>{d.highlight || <span style={{ color: 'var(--text-muted)', fontStyle: 'italic' }}>(sin descripción)</span>}</div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function HabitEditor({ month, setMonth }) {
  const [collapsed, setCollapsed] = React.useState(false);
  const habits = month.habits;
  const update = (id, mut) => setMonth(m => ({
    ...m,
    habits: m.habits.map(h => h.id === id ? { ...h, ...mut } : h),
  }));
  const remove = (id) => setMonth(m => {
    const next = { ...m, habits: m.habits.filter(h => h.id !== id) };
    next.days = next.days.map(d => {
      const habits = { ...d.habits };
      delete habits[id];
      return { ...d, habits };
    });
    return next;
  });
  const palette = ['#1F8A5B', '#7C5CD0', '#2A6FDB', '#C97A2A', '#D9445C', '#0E8E8E'];
  const add = () => setMonth(m => {
    const id = 'h' + Date.now();
    const used = m.habits.map(h => h.color);
    const color = palette.find(c => !used.includes(c)) || palette[m.habits.length % palette.length];
    return {
      ...m,
      habits: [...m.habits, { id, label: 'Nuevo hábito', short: 'New', type: 'check', targetPerWeek: 7, color }],
      days: m.days.map(d => ({ ...d, habits: { ...d.habits, [id]: 0 } })),
    };
  });

  return (
    <div style={{
      background: 'var(--surface)',
      border: '1px solid var(--line)',
      borderRadius: 14,
      overflow: 'hidden',
    }}>
      <div style={{
        padding: '16px 18px 12px',
        borderBottom: collapsed ? 'none' : '1px solid var(--line)',
        display: 'flex', alignItems: 'flex-start', gap: 12,
      }}>
        <div style={{ flex: 1 }}>
          <h3 style={{
            margin: 0, fontFamily: 'Instrument Serif, serif', fontWeight: 400,
            fontSize: 22, color: 'var(--text)',
          }}>Configuración de hábitos</h3>
          <div style={{
            marginTop: 2, fontFamily: 'Inter, sans-serif', fontSize: 12,
            color: 'var(--text-muted)',
          }}>
            {collapsed
              ? `${habits.length} hábitos configurados`
              : 'Personaliza qué tracker y target quieres para este mes'}
          </div>
        </div>
        <button
          onClick={() => setCollapsed(c => !c)}
          title={collapsed ? 'Expandir' : 'Minimizar'}
          style={{
            width: 28, height: 28, borderRadius: 7,
            border: '1px solid var(--line)',
            background: 'var(--surface-alt)',
            cursor: 'pointer', flexShrink: 0,
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            color: 'var(--text-soft)', padding: 0,
          }}
        >
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none"
               style={{ transform: collapsed ? 'rotate(0deg)' : 'rotate(180deg)', transition: 'transform 160ms' }}>
            <path d="M3 4.5l3 3 3-3" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" />
          </svg>
        </button>
      </div>

      {!collapsed && (
        <>
          {/* Column headers */}
          <div style={{
            display: 'grid',
            gridTemplateColumns: '24px 1.2fr 0.55fr 1fr 1.2fr 28px',
            gap: 12,
            padding: '5px 14px 4px',
            borderBottom: '1px solid var(--line-soft)',
            fontFamily: 'Inter, sans-serif', fontSize: 9.5, fontWeight: 600,
            color: 'var(--text-muted)', textTransform: 'uppercase', letterSpacing: '0.07em',
          }}>
            <div />
            <div>Nombre</div>
            <div>Vista</div>
            <div>Tipo</div>
            <div>Target</div>
            <div />
          </div>

          {habits.map(h => (
            <HabitRow
              key={h.id}
              habit={h}
              palette={palette}
              onChange={mut => update(h.id, mut)}
              onDelete={() => remove(h.id)}
              canDelete={habits.length > 1}
            />
          ))}

          <div style={{ padding: '10px 14px' }}>
            <button
              onClick={add}
              style={{
                display: 'flex', alignItems: 'center', gap: 8,
                padding: '8px 12px', borderRadius: 8,
                border: '1px dashed var(--line-strong)',
                background: 'transparent', cursor: 'pointer',
                color: 'var(--text-soft)',
                fontFamily: 'Inter, sans-serif', fontSize: 12.5, fontWeight: 500,
                width: '100%', justifyContent: 'center',
              }}
            >
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                <path d="M6 2v8M2 6h8" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" />
              </svg>
              Añadir hábito
            </button>
          </div>
        </>
      )}
    </div>
  );
}

function HabitRow({ habit, palette, onChange, onDelete, canDelete }) {
  return (
    <div style={{
      display: 'grid',
      gridTemplateColumns: '24px 1.2fr 0.55fr 1fr 1.2fr 28px',
      alignItems: 'center', gap: 12,
      padding: '10px 14px',
      borderBottom: '1px solid var(--line-soft)',
    }}>
      {/* color picker */}
      <ColorDot color={habit.color} options={palette} onChange={c => onChange({ color: c })} />

      {/* full name */}
      <input
        value={habit.label}
        onChange={e => onChange({ label: e.target.value })}
        placeholder="Nombre del hábito"
        style={{
          border: '1px solid var(--line)',
          outline: 'none',
          background: 'var(--surface-alt)',
          borderRadius: 6,
          padding: '3px 7px',
          fontFamily: 'Inter, sans-serif', fontSize: 13, fontWeight: 500,
          color: 'var(--text)',
          minWidth: 0, width: '100%',
          display: 'block',
        }}
      />

      {/* short / abbreviation shown in table header */}
      <input
        value={habit.short}
        onChange={e => onChange({ short: e.target.value.slice(0, 7) })}
        maxLength={7}
        placeholder="Abrev."
        title="Texto que aparece en la cabecera de la vista mensual"
        style={{
          border: '1px solid var(--line)',
          outline: 'none',
          background: 'var(--surface-alt)',
          borderRadius: 6,
          padding: '3px 7px',
          fontFamily: 'JetBrains Mono, monospace', fontSize: 11, fontWeight: 600,
          color: 'var(--text)',
          minWidth: 0, width: '100%',
        }}
      />

      {/* type segmented */}
      <div style={{
        display: 'inline-flex', padding: 2,
        background: 'var(--surface-alt)',
        border: '1px solid var(--line)', borderRadius: 7,
      }}>
        {[
          { id: 'check', label: 'Check' },
          { id: 'numeric', label: 'Número' },
        ].map(o => (
          <button
            key={o.id}
            onClick={() => onChange(o.id === 'numeric'
              ? { type: 'numeric', goal: habit.goal || 7000 }
              : { type: 'check', targetPerWeek: habit.targetPerWeek || 7 })}
            style={{
              padding: '4px 10px', flex: 1,
              background: habit.type === o.id ? 'var(--surface)' : 'transparent',
              border: 'none', cursor: 'pointer', borderRadius: 5,
              fontFamily: 'Inter, sans-serif', fontSize: 11,
              fontWeight: habit.type === o.id ? 600 : 500,
              color: habit.type === o.id ? 'var(--text)' : 'var(--text-muted)',
            }}
          >{o.label}</button>
        ))}
      </div>

      {/* target editor */}
      <TargetEditor habit={habit} onChange={onChange} />

      {/* delete */}
      <button
        onClick={onDelete}
        disabled={!canDelete}
        title="Eliminar hábito"
        style={{
          width: 24, height: 24, borderRadius: 6, border: 'none',
          background: 'transparent',
          cursor: canDelete ? 'pointer' : 'not-allowed',
          color: 'var(--text-muted)', opacity: canDelete ? 0.5 : 0.2,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
        }}
      >
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
          <path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" />
        </svg>
      </button>
    </div>
  );
}

function ColorDot({ color, options, onChange }) {
  const [open, setOpen] = React.useState(false);
  return (
    <div style={{ position: 'relative' }}>
      <button
        onClick={() => setOpen(o => !o)}
        style={{
          width: 18, height: 18, borderRadius: '50%',
          background: color, border: '1.5px solid var(--surface)',
          boxShadow: '0 0 0 1px var(--line)',
          cursor: 'pointer', padding: 0,
        }}
      />
      {open && (
        <>
          <div onClick={() => setOpen(false)} style={{
            position: 'fixed', inset: 0, zIndex: 100,
          }} />
          <div style={{
            position: 'absolute', top: 24, left: 0, zIndex: 101,
            background: 'var(--surface)', border: '1px solid var(--line)',
            borderRadius: 8, padding: 6,
            boxShadow: '0 8px 24px rgba(0,0,0,0.15)',
            display: 'grid', gridTemplateColumns: 'repeat(3, 18px)', gap: 6,
          }}>
            {options.map(c => (
              <button
                key={c}
                onClick={() => { onChange(c); setOpen(false); }}
                style={{
                  width: 18, height: 18, borderRadius: '50%',
                  background: c, border: c === color ? '2px solid var(--text)' : '1px solid var(--line)',
                  cursor: 'pointer', padding: 0,
                }}
              />
            ))}
          </div>
        </>
      )}
    </div>
  );
}

function TargetEditor({ habit, onChange }) {
  if (habit.type === 'numeric') {
    return (
      <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
        <input
          type="number"
          value={habit.goal || 0}
          onChange={e => onChange({ goal: Math.max(0, parseInt(e.target.value, 10) || 0) })}
          style={{
            width: 80, height: 26,
            border: '1px solid var(--line)', borderRadius: 6,
            background: 'var(--surface-alt)', color: 'var(--text)',
            padding: '0 8px',
            fontFamily: 'JetBrains Mono, monospace', fontSize: 12,
            fontVariantNumeric: 'tabular-nums', textAlign: 'right',
            outline: 'none',
          }}
        />
        <span style={{
          fontFamily: 'Inter, sans-serif', fontSize: 12,
          color: 'var(--text-muted)',
        }}>al día</span>
      </div>
    );
  }
  // check: target per week
  const tpw = habit.targetPerWeek || 7;
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
      <select
        value={tpw}
        onChange={e => onChange({ targetPerWeek: parseInt(e.target.value, 10) })}
        style={{
          height: 26, padding: '0 22px 0 8px',
          border: '1px solid var(--line)', borderRadius: 6,
          background: 'var(--surface-alt)', color: 'var(--text)',
          fontFamily: 'Inter, sans-serif', fontSize: 12,
          outline: 'none', cursor: 'pointer',
          appearance: 'none', WebkitAppearance: 'none',
          backgroundImage: "url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='gray' d='M0 0h10L5 6z'/></svg>\")",
          backgroundRepeat: 'no-repeat',
          backgroundPosition: 'right 6px center',
        }}
      >
        {[1, 2, 3, 4, 5, 6, 7].map(n => (
          <option key={n} value={n}>
            {n === 7 ? 'Todos los días' : `${n} ${n === 1 ? 'día' : 'días'}/semana`}
          </option>
        ))}
      </select>
    </div>
  );
}

function OverviewView({ month, setMonth }) {
  // Aggregate metrics
  const totalDone = month.habits.reduce((sum, h) => sum + habitStats(month, h).done, 0);
  const totalPossible = month.habits.length * month.days.length;
  const avgPct = Math.round((totalDone / totalPossible) * 100);

  const goals = month.goals || [];
  const goalsDone = goals.filter(g => g.done).length;
  const goalsPct = goals.length ? Math.round((goalsDone / goals.length) * 100) : 0;

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 18 }}>
      {/* Top summary band */}
      <div style={{
        display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 12,
      }}>
        <SummaryCard
          label="Cumplimiento general"
          value={`${avgPct}%`}
          sub={`media de ${month.habits.length} hábitos`}
        />
        <SummaryCard
          label="Hitos del mes"
          value={`${goalsDone}/${goals.length || 0}`}
          sub={`${goalsPct}% completado`}
        />
        <SummaryCard
          label="Días destacados"
          value={month.days.filter(d => d.milestone).length}
          sub="marcados con ★"
        />
      </div>

      {/* Editable goal checklist */}
      <GoalsChecklist month={month} setMonth={setMonth} />

      {/* Per-habit stats */}
      <div>
        <SectionLabel>Estadísticas por hábito</SectionLabel>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: 12 }}>
          {month.habits.map(h => (
            <OverviewStatTile key={h.id} habit={h} month={month} />
          ))}
        </div>
      </div>

      {/* Editable habit configuration (below stats so it doesn't crowd them) */}
      <HabitEditor month={month} setMonth={setMonth} />

      {/* Milestone days */}
      <MonthMilestones month={month} />
    </div>
  );
}

function SectionLabel({ children }) {
  return (
    <div style={{
      fontFamily: 'Inter, sans-serif', fontSize: 11, fontWeight: 600,
      color: 'var(--text-muted)', textTransform: 'uppercase',
      letterSpacing: '0.08em', marginBottom: 10, paddingLeft: 2,
    }}>{children}</div>
  );
}

function SummaryCard({ label, value, sub }) {
  return (
    <div style={{
      background: 'var(--surface)',
      border: '1px solid var(--line)',
      borderRadius: 12,
      padding: '14px 18px',
    }}>
      <div style={{
        fontFamily: 'Inter, sans-serif', fontSize: 11, fontWeight: 600,
        color: 'var(--text-muted)', textTransform: 'uppercase',
        letterSpacing: '0.06em', marginBottom: 8,
      }}>{label}</div>
      <div style={{
        fontFamily: 'Instrument Serif, serif', fontSize: 36,
        lineHeight: 1, color: 'var(--text)',
        fontVariantNumeric: 'tabular-nums',
      }}>{value}</div>
      <div style={{
        marginTop: 4,
        fontFamily: 'JetBrains Mono, monospace', fontSize: 11,
        color: 'var(--text-muted)',
      }}>{sub}</div>
    </div>
  );
}

Object.assign(window, { OverviewView });

</script>

<script type="text/babel">
// app.jsx — Osmin app shell + stats + month milestones

const { useState, useMemo, useEffect, useRef } = React;

// ── Persistence ──────────────────────────────────────────────────────────────
const STORAGE_KEY = 'osmin_v1';

function loadSaved() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    // Basic sanity check
    if (!Array.isArray(parsed.months) || parsed.months.length === 0) return null;
    return parsed;
  } catch (e) {
    return null;
  }
}

function saveState(state) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    // Storage full or unavailable — fail silently
  }
}

function Logo() {
  return (
    <img
      src="logo.png"
      alt="Osmin"
      style={{
        height: 26,
        width: 'auto',
        display: 'block',
        filter: 'brightness(0) invert(1) opacity(0.88)',
      }}
    />
  );
}

function TrafficLights() {
  const dot = (c) => (
    <div style={{ width: 12, height: 12, borderRadius: '50%', background: c }} />
  );
  return (
    <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
      {dot('#ff5f57')}{dot('#febc2e')}{dot('#28c840')}
    </div>
  );
}

function NewMonthPicker({ suggested, months, onConfirm, onCancel }) {
  const [year, setYear] = React.useState(suggested.year);
  const [monthIdx, setMonthIdx] = React.useState(suggested.month);

  return (
    <div style={{
      margin: '4px 0',
      background: 'var(--surface)',
      border: '1px solid var(--line)',
      borderRadius: 10,
      overflow: 'hidden',
    }}>
      {/* year stepper */}
      <div style={{
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        padding: '8px 10px',
        borderBottom: '1px solid var(--line-soft)',
      }}>
        <button
          onClick={() => setYear(y => y - 1)}
          style={{
            width: 22, height: 22, borderRadius: 6,
            border: '1px solid var(--line)', background: 'var(--surface-alt)',
            color: 'var(--text-soft)', cursor: 'pointer', padding: 0,
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            fontSize: 14, lineHeight: 1,
          }}
        >‹</button>
        <span style={{
          fontFamily: 'JetBrains Mono, monospace', fontSize: 13, fontWeight: 600,
          color: 'var(--text)', fontVariantNumeric: 'tabular-nums',
        }}>{year}</span>
        <button
          onClick={() => setYear(y => y + 1)}
          style={{
            width: 22, height: 22, borderRadius: 6,
            border: '1px solid var(--line)', background: 'var(--surface-alt)',
            color: 'var(--text-soft)', cursor: 'pointer', padding: 0,
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            fontSize: 14, lineHeight: 1,
          }}
        >›</button>
      </div>

      {/* month grid 4×3 */}
      <div style={{
        display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)',
        gap: 3, padding: '8px',
      }}>
        {MONTHS_ES.map((name, i) => {
          const sel = i === monthIdx;
          const alreadyExists = months.some(m => m.year === year && m.month === i);
          return (
            <button
              key={i}
              onClick={() => !alreadyExists && setMonthIdx(i)}
              title={alreadyExists ? 'Ya existe este mes' : name}
              style={{
                padding: '5px 2px', borderRadius: 6,
                border: sel ? '1.5px solid var(--accent)' : '1px solid transparent',
                background: sel ? `color-mix(in oklab, var(--accent) 14%, var(--surface))` : 'transparent',
                cursor: alreadyExists ? 'not-allowed' : 'pointer',
                fontFamily: 'Inter, sans-serif', fontSize: 10.5, fontWeight: sel ? 600 : 500,
                color: alreadyExists ? 'var(--text-muted)' : sel ? 'var(--text)' : 'var(--text-soft)',
                opacity: alreadyExists ? 0.4 : 1,
                textAlign: 'center',
              }}
            >{name.slice(0, 3)}</button>
          );
        })}
      </div>

      {/* actions */}
      <div style={{
        display: 'flex', gap: 6, padding: '0 8px 8px',
      }}>
        <button
          onClick={onCancel}
          style={{
            flex: 1, height: 26, borderRadius: 7,
            border: '1px solid var(--line)', background: 'transparent',
            cursor: 'pointer', fontFamily: 'Inter, sans-serif',
            fontSize: 11.5, fontWeight: 500, color: 'var(--text-muted)',
          }}
        >Cancelar</button>
        <button
          onClick={() => onConfirm(year, monthIdx)}
          style={{
            flex: 1, height: 26, borderRadius: 7,
            border: 'none', background: 'var(--accent)',
            cursor: 'pointer', fontFamily: 'Inter, sans-serif',
            fontSize: 11.5, fontWeight: 600, color: '#fff',
          }}
        >Crear</button>
      </div>
    </div>
  );
}

function Sidebar({ months, activeIdx, setActiveIdx, addMonth, deleteMonth, view, setView, onOpenAccount }) {
  const [hoveredIdx, setHoveredIdx] = React.useState(null);
  const [picker, setPicker] = React.useState(null); // null | { year, month }
  const [showTip, setShowTip] = React.useState(() => !localStorage.getItem('osmin_tip_dismissed'));
  const month = months[activeIdx];
  const userEmail = React.useMemo(() => localStorage.getItem('osmin_user_email') || 'usuario', []);
  const userInitial = userEmail[0].toUpperCase();

  const dismissTip = () => {
    localStorage.setItem('osmin_tip_dismissed', '1');
    setShowTip(false);
  };

  const openPicker = () => {
    const last = months[months.length - 1];
    let m = last.month + 1, y = last.year;
    if (m > 11) { m = 0; y++; }
    // skip months that already exist
    while (months.some(mo => mo.year === y && mo.month === m)) {
      m++; if (m > 11) { m = 0; y++; }
    }
    setPicker({ year: y, month: m });
  };

  const item = (id, label, count) => {
    const sel = view === id;
    return (
      <button
        key={id}
        onClick={() => setView(id)}
        style={{
          display: 'flex', alignItems: 'center', justifyContent: 'space-between',
          gap: 8, padding: '6px 10px', borderRadius: 7,
          border: 'none', cursor: 'pointer', textAlign: 'left',
          background: sel ? 'var(--sidebar-sel)' : 'transparent',
          color: sel ? 'var(--text)' : 'var(--text-soft)',
          fontFamily: 'Inter, sans-serif', fontSize: 13,
          fontWeight: sel ? 600 : 500,
        }}
      >
        <span>{label}</span>
        {count !== undefined && (
          <span style={{
            fontFamily: 'JetBrains Mono, monospace',
            fontSize: 10.5, color: 'var(--text-muted)',
            fontVariantNumeric: 'tabular-nums',
          }}>{count}</span>
        )}
      </button>
    );
  };

  const sectionTitle = (t) => (
    <div style={{
      fontFamily: 'Inter, sans-serif', fontSize: 10.5, fontWeight: 600,
      color: 'var(--text-muted)', textTransform: 'uppercase',
      letterSpacing: '0.08em', padding: '14px 10px 6px',
    }}>{t}</div>
  );

  return (
    <aside style={{
      width: 224, flexShrink: 0,
      background: 'var(--sidebar)', borderRight: '1px solid var(--line)',
      display: 'flex', flexDirection: 'column',
      padding: '0 10px 14px',
    }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 14, padding: '14px 10px 16px' }}>
        <TrafficLights />
        <Logo />
      </div>

      {sectionTitle('Vista')}
      {item('month', 'Mes actual')}
      {item('year', `Año ${month.year}`)}
      {item('habits', 'Hábitos', month.habits.length)}
      {item('stats', 'Estadísticas')}

      {sectionTitle('Meses')}
      <div style={{ display: 'flex', flexDirection: 'column', gap: 1 }}>
        {months.map((m, i) => {
          const sel = i === activeIdx;
          const hovered = hoveredIdx === i;
          return (
            <div
              key={`${m.year}-${m.month}`}
              onMouseEnter={() => setHoveredIdx(i)}
              onMouseLeave={() => setHoveredIdx(null)}
              style={{ position: 'relative', display: 'flex', alignItems: 'center' }}
            >
              <button
                onClick={() => setActiveIdx(i)}
                style={{
                  flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'space-between',
                  padding: '5px 10px', paddingRight: hovered && months.length > 1 ? 30 : 10,
                  borderRadius: 7,
                  border: 'none', cursor: 'pointer', textAlign: 'left',
                  background: sel ? 'var(--sidebar-sel)' : 'transparent',
                  fontFamily: 'Inter, sans-serif', fontSize: 12.5,
                  color: sel ? 'var(--text)' : 'var(--text-soft)',
                  fontWeight: sel ? 600 : 500,
                }}
              >

      <div style={{ flex: 1 }} />

      <button

        style={{

function AccountPanel({ onClose }) {
  const userEmail = localStorage.getItem('osmin_user_email') || 'usuario';
  const userInitial = userEmail[0].toUpperCase();

  React.useEffect(() => {
    if (!document.getElementById('osmin-ac-styles')) {
      const s = document.createElement('style');
      s.id = 'osmin-ac-styles';
      s.textContent = `
        @keyframes acOverlayIn { from { opacity:0 } to { opacity:1 } }
        @keyframes acPanelIn   { from { transform:translateX(100%) } to { transform:translateX(0) } }
      `;
      document.head.appendChild(s);
    }
  }, []);

  const joinFormatted = React.useMemo(() => {
    try {
      const raw = localStorage.getItem('osmin_join_date') || new Date().toISOString();
      return new Date(raw).toLocaleDateString('es-ES', { year: 'numeric', month: 'long', day: 'numeric' });
    } catch { return '—'; }
  }, []);

  const stats = React.useMemo(() => {
    try {
      const raw = localStorage.getItem('osmin_v1');
      if (!raw) return { months: 0, habits: 0, days: 0, pct: 0 };
      const data = JSON.parse(raw);
      const totalMonths = data.months?.length || 0;
      const habitSet = new Set();
      data.months?.forEach(m => m.habits?.forEach(h => habitSet.add(h.label)));
      let totalDays = 0, doneDays = 0;
      data.months?.forEach(m => {
        m.days?.forEach(d => {
          if (d.type === 'festivo' || d.type === 'vacaciones') return;
          totalDays++;
          const hasAny = m.habits?.some(h => {
            const v = d.habits?.[h.id];
            return h.type === 'check' ? v === 1 : (v || 0) >= (h.goal || 1);
          });
          if (hasAny) doneDays++;
        });
      });
      return { months: totalMonths, habits: habitSet.size, days: doneDays, pct: totalDays ? Math.round((doneDays / totalDays) * 100) : 0 };
    } catch { return { months: 0, habits: 0, days: 0, pct: 0 }; }
  }, []);

  const [confirmDelete, setConfirmDelete] = React.useState(false);
  const [toast, setToast] = React.useState('');

  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(''), 2500); };

  const handleExport = () => {
    try {
      const blob = new Blob([localStorage.getItem('osmin_v1') || '{}'], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `osmin-datos-${new Date().toISOString().slice(0, 10)}.json`;
      a.click(); URL.revokeObjectURL(url);
      showToast('Datos exportados correctamente');
    } catch { showToast('Error al exportar'); }
  };

  const handleLogout = () => {
    localStorage.removeItem('osmin_user_email');
    window.location.href = 'landing-a.html';
  };

  const handleDelete = () => {
    ['osmin_v1', 'osmin_user_email', 'osmin_tip_dismissed', 'osmin_join_date'].forEach(k => localStorage.removeItem(k));
    window.location.href = 'landing-a.html';
  };

  const FEATURES = ['Seguimiento de hábitos', 'Bitácora diaria', 'Estadísticas del mes', 'Vista de highlights', 'Exportación de datos', 'Acceso anticipado'];

  return (
    <>
      {/* Backdrop */}
      <div onClick={onClose} style={{
        position: 'fixed', inset: 0, zIndex: 40,
        background: 'rgba(0,0,0,0.48)',
        backdropFilter: 'blur(3px)',
        animation: 'acOverlayIn 200ms ease forwards',
      }} />

      {/* Drawer */}
      <div style={{
        position: 'fixed', top: 0, right: 0, bottom: 0, zIndex: 50,
        width: 400, maxWidth: '95vw',
        background: 'var(--bg-app)',
        borderLeft: '1px solid var(--line)',
        display: 'flex', flexDirection: 'column',
        overflowY: 'auto',
        boxShadow: '-20px 0 60px rgba(0,0,0,.4)',
        animation: 'acPanelIn 260ms cubic-bezier(.3,.7,.4,1) forwards',
      }}>

        {/* Header */}
        <div style={{
          display: 'flex', alignItems: 'center', justifyContent: 'space-between',
          padding: '16px 20px', borderBottom: '1px solid var(--line)',
          position: 'sticky', top: 0, background: 'var(--bg-app)', zIndex: 2,
        }}>
          <img src="logo.png" alt="Osmin" style={{ height: 22, filter: 'brightness(0) invert(1) opacity(.88)' }} />
          <button onClick={onClose} style={{
            width: 30, height: 30, border: '1px solid var(--line)',
            background: 'transparent', borderRadius: 8,
            cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center',
            color: 'var(--text-muted)',
          }}>
            <svg width="11" height="11" viewBox="0 0 11 11" fill="none">
              <path d="M1 1l9 9M10 1L1 10" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/>
            </svg>
          </button>
        </div>

        <div style={{ padding: '20px 20px 40px', display: 'flex', flexDirection: 'column', gap: 14 }}>

          {/* Profile */}
          <div style={{
            background: 'var(--surface)', border: '1px solid var(--line)', borderRadius: 14,
            padding: '22px 20px', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 10,
          }}>
            <div style={{
              width: 60, height: 60, borderRadius: '50%',
              background: 'linear-gradient(135deg, #4ECDC4 0%, #1F8A5B 100%)',
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              fontSize: 24, fontWeight: 700, color: '#fff',
            }}>{userInitial}</div>
            <div style={{ textAlign: 'center' }}>
              <div style={{ fontFamily: 'Inter, sans-serif', fontSize: 14, fontWeight: 600, color: 'var(--text)' }}>{userEmail}</div>
              <div style={{ marginTop: 6 }}>
                <span style={{
                  fontFamily: 'JetBrains Mono, monospace', fontSize: 9.5, fontWeight: 600,
                  color: '#4ECDC4', background: 'rgba(78,205,196,.1)',
                  border: '1px solid rgba(78,205,196,.25)', borderRadius: 5,
                  padding: '2px 8px', letterSpacing: '.05em',

                <span style={{ fontFamily: 'Instrument Serif, serif', fontSize: 20, color: 'var(--text)' }}>Gratis</span>
              </div>
            </div>
            {FEATURES.map(f => (
              <div key={f} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '7px 0', borderTop: '1px solid var(--line-soft)', fontFamily: 'Inter, sans-serif', fontSize: 12.5, color: 'var(--text-soft)' }}>
                <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
                  <path d="M2 7l3 3 6-6" stroke="#1F8A5B" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>
                </svg>
                {f}
              </div>
            ))}
            <div style={{ marginTop: 12, padding: '8px 12px', borderRadius: 7, background: 'rgba(42,111,219,.07)', border: '1px solid rgba(42,111,219,.15)', fontFamily: 'Inter, sans-serif', fontSize: 11, color: 'var(--text-muted)' }}>
              El precio puede cambiar cuando salgamos de acceso anticipado.
            </div>
          </div>

          {/* Stats */}
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8 }}>
            {[
              { label: 'Meses', value: stats.months },
              { label: 'Hábitos únicos', value: stats.habits },
              { label: 'Días completados', value: stats.days },
              { label: 'Cumplimiento', value: `${stats.pct}%` },
            ].map(s => (
              <div key={s.label} style={{ background: 'var(--surface)', border: '1px solid var(--line)', borderRadius: 10, padding: '14px 16px' }}>
                <div style={{ fontFamily: 'Instrument Serif, serif', fontSize: 26, color: 'var(--text)', lineHeight: 1 }}>{s.value}</div>

          {/* Actions */}
          <div style={{ background: 'var(--surface)', border: '1px solid var(--line)', borderRadius: 14, overflow: 'hidden' }}>
            <button onClick={handleExport} style={{
              width: '100%', padding: '14px 20px', border: 'none',
              borderBottom: '1px solid var(--line-soft)', background: 'transparent', cursor: 'pointer',
              display: 'flex', alignItems: 'center', gap: 12, textAlign: 'left',

            {!confirmDelete ? (
              <button onClick={() => setConfirmDelete(true)} style={{
                padding: '7px 16px', borderRadius: 8,
                border: '1px solid rgba(224,82,82,.3)', background: 'transparent',
                cursor: 'pointer', fontFamily: 'Inter, sans-serif', fontSize: 12.5, color: '#E05252',
              }}>
                Eliminar cuenta y datos
              </button>
            ) : (
              <div>
                <div style={{ fontFamily: 'Inter, sans-serif', fontSize: 12, color: 'var(--text-muted)', marginBottom: 10 }}>
                  Esta acción eliminará todos tus datos locales. ¿Continuar?
                </div>
                <div style={{ display: 'flex', gap: 8 }}>
                  <button onClick={() => setConfirmDelete(false)} style={{
                    flex: 1, padding: '8px', borderRadius: 7,
                    border: '1px solid var(--line)', background: 'transparent',
                    cursor: 'pointer', fontFamily: 'Inter, sans-serif', fontSize: 12, color: 'var(--text-muted)',
                  }}>Cancelar</button>
                  <button onClick={handleDelete} style={{
                    flex: 1, padding: '8px', borderRadius: 7,
                    border: 'none', background: '#E05252',
                    cursor: 'pointer', fontFamily: 'Inter, sans-serif', fontSize: 12, fontWeight: 600, color: '#fff',
                  }}>Sí, eliminar</button>
                </div>
              </div>
            )}
          </div>
        </div>

        {/* Toast */}
        {toast && (
          <div style={{
            position: 'fixed', bottom: 20, left: '50%', transform: 'translateX(-50%)',
            background: 'var(--surface)', border: '1px solid var(--line)',
            padding: '10px 20px', borderRadius: 10, zIndex: 60,
            fontFamily: 'Inter, sans-serif', fontSize: 13, color: 'var(--text)',
            boxShadow: '0 8px 24px rgba(0,0,0,.4)',
            animation: 'acOverlayIn 180ms ease',
          }}>{toast}</div>
        )}
      </div>
    </>
  );
}

function App() {
  // Load persisted state once at startup
  const saved = useMemo(() => loadSaved(), []);

  const [months, setMonths] = useState(() =>
    saved?.months?.length ? saved.months : [buildSampleMonth()]
  );
  const [activeIdx, setActiveIdx] = useState(() => {
    const idx = saved?.activeIdx ?? 0;
    const months = saved?.months;
    return months ? Math.min(idx, months.length - 1) : 0;
  });
  const [view, setView] = useState('month');
  const [layout, setLayoutState] = useState(() => saved?.layout ?? 'table');
  const [viewMode, setViewMode] = useState('month'); // 'month' | 'overview' — intentionally not persisted
  const [showAccount, setShowAccount] = useState(false);

  const month = months[activeIdx];
  const setMonth = (updater) => {
    setMonths(ms => {
      const next = ms.slice();
      next[activeIdx] = typeof updater === 'function' ? updater(ms[activeIdx]) : updater;
      return next;
    });
  };

  const addMonth = (year, monthIdx) => {
    const last = months[months.length - 1];
    const newIdx = months.length;
    setMonths(ms => [...ms, buildBlankMonth(year, monthIdx, last.habits)]);
    setActiveIdx(newIdx);
    setViewMode('month');
  };

  const deleteMonth = (idx) => {
    if (months.length <= 1) return;
    setMonths(ms => ms.filter((_, i) => i !== idx));
    setActiveIdx(ai => {
      if (idx < ai) return ai - 1;
      if (idx === ai) return Math.max(0, idx - 1);
      return ai;
    });
  };

  const twkDefaults = window.__OSMIN_TWEAK_DEFAULTS || { theme: 'light', density: 'comfy', accent: '#C97A2A' };
  const [tweaks, setTweak] = window.useTweaks({ ...twkDefaults, ...(saved?.tweaks || {}) });

  // Apply theme + density to root via data attrs
  useEffect(() => {
    document.documentElement.dataset.theme = tweaks.theme;
    document.documentElement.dataset.density = tweaks.density;
    document.documentElement.style.setProperty('--accent', tweaks.accent);
  }, [tweaks.theme, tweaks.density, tweaks.accent]);

  // Persist all state to localStorage on every relevant change
  // Skip the very first render (saved state is already in storage)
  const isFirstRender = useRef(true);
  useEffect(() => {
    if (isFirstRender.current) { isFirstRender.current = false; return; }
    saveState({ months, activeIdx, layout, tweaks });
  }, [months, activeIdx, layout, tweaks]);

  return (
    <div style={{
      width: '100%', height: '100vh',
      display: 'flex', overflow: 'hidden',
      background: 'var(--bg-app)',
    }}>
      <Sidebar
        months={months} activeIdx={activeIdx}
        setActiveIdx={(i) => { setActiveIdx(i); setViewMode('month'); }}
        addMonth={addMonth} deleteMonth={deleteMonth}
        view={view} setView={setView}
        onOpenAccount={() => setShowAccount(true)}
      />

      <main style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
        <MonthHeader
          month={month}
          layout={layout}
          setLayout={setLayoutState}
          onPrev={() => setActiveIdx(i => Math.max(0, i - 1))}
          onNext={() => setActiveIdx(i => Math.min(months.length - 1, i + 1))}
          viewMode={viewMode}
          setViewMode={setViewMode}
        />

        <div style={{ flex: 1, overflow: 'auto', padding: '20px 28px 80px' }}>
          {viewMode === 'overview' ? (
            <window.OverviewView month={month} setMonth={setMonth} />
          ) : layout === 'table' ? (
            <TableLayout month={month} setMonth={setMonth} density={tweaks.density} />
          ) : (
            <JournalLayout month={month} setMonth={setMonth} density={tweaks.density} />
          )}
        </div>
      </main>

      {/* Tweaks panel */}
      {window.TweaksPanel && (
        <window.TweaksPanel title="Tweaks">
          <window.TweakSection label="Apariencia" />
          <window.TweakRadio
            label="Tema"
            value={tweaks.theme}
            onChange={v => setTweak('theme', v)}
            options={[{ value: 'light', label: 'Claro' }, { value: 'dark', label: 'Oscuro' }]}
          />
          <window.TweakRadio
            label="Densidad"
            value={tweaks.density}
            onChange={v => setTweak('density', v)}
            options={[{ value: 'comfy', label: 'Cómoda' }, { value: 'compact', label: 'Compacta' }]}
          />
          <window.TweakColor
            label="Acento"
            value={tweaks.accent}
            onChange={v => setTweak('accent', v)}
            options={['#C97A2A', '#2A6FDB', '#1F8A5B', '#7C5CD0']}
          />
          <window.TweakSection label="Layout" />
          <window.TweakRadio
            label="Vista del mes"
            value={layout}
            onChange={setLayoutState}
            options={[{ value: 'table', label: 'Tabla' }, { value: 'journal', label: 'Bitácora' }]}
          />
        </window.TweaksPanel>
      )}

      {showAccount && <AccountPanel onClose={() => setShowAccount(false)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
