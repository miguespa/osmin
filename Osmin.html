  :root {
    --accent: #C97A2A;

    /* light (default — warm paper) */
    --bg-app: #F5F2EC;
    --surface: #FBFAF7;
    --surface-alt: #F2EFE8;
    --sidebar: #EFEBE3;
    --sidebar-sel: rgba(0,0,0,0.07);
    --text: #1a1916;
    --text-soft: #4a4842;
    --text-muted: #8a8780;
    --line: #E3DED4;
    --line-soft: #ECE7DC;
    --line-strong: #C9C3B7;
    --c-festivo: #B8E5A8;       /* soft green */
    --c-vacaciones: #F8E48A;    /* soft yellow */
  }

  html[data-theme="dark"] {
    --bg-app: #16161A;
    --surface: #1E1E22;
    --surface-alt: #232328;
    --sidebar: #1A1A1E;
    --sidebar-sel: rgba(255,255,255,0.08);
    --text: #ECEAE4;
    --text-soft: #BFBDB6;
    --text-muted: #82807A;

    --line-soft: #26262B;
    --line-strong: #3D3D44;
    --c-festivo: #4A7A45;
    --c-vacaciones: #B5A14E;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text); background: var(--bg-app);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }
  body {
    /* very subtle paper grid texture */
    background-image:
      linear-gradient(to right, rgba(0,0,0,0.018) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(0,0,0,0.018) 1px, transparent 1px);
    background-size: 24px 24px;
  }
  html[data-theme="dark"] body {
    background-image:
      linear-gradient(to right, rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 24px 24px;
  }

  #root { height: 100vh; }

  button { font-family: inherit; }
  input::placeholder { color: var(--text-muted); opacity: 1; }

    width: 28px; height: 28px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--text-soft);
    border-radius: 7px;
    cursor: pointer;
    font-size: 18px; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center;
    padding: 0;
    transition: all 120ms;
  }
  .month-nav:hover { background: var(--surface-alt); color: var(--text); }

    display: inline-flex; align-items: center; gap: 7px;
    height: 28px; padding: 0 12px; margin-left: 8px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--text-soft);

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, window.location.origin);
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', noDeckControls = false, children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  // Auto-inject a rail toggle when a <deck-stage> is on the page. The
  // toggle drives the deck's per-viewer _railVisible via window message;
  // state is mirrored from the same localStorage key the deck reads so
  // the control reflects reality across reloads. The mechanism is the
  // message — authors who want custom placement can post it directly
  // and pass noDeckControls to suppress this one.
  const hasDeckStage = React.useMemo(
    () => typeof document !== 'undefined' && !!document.querySelector('deck-stage'),
    [],
  );
  // Hide the toggle until the host has actually enabled the rail (the
  // __omelette_rail_enabled window message, posted only when the
  // omelette_deck_rail_enabled flag is on for this user). The initial read
  // covers TweaksPanel mounting after the message already arrived; the
  // listener covers the common case of mounting first.
  const [railEnabled, setRailEnabled] = React.useState(
    () => hasDeckStage && !!document.querySelector('deck-stage')?._railEnabled,
  );
  React.useEffect(() => {
    if (!hasDeckStage || railEnabled) return undefined;
    const onMsg = (e) => {
      if (e.data && e.data.type === '__omelette_rail_enabled') setRailEnabled(true);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [hasDeckStage, railEnabled]);
  const [railVisible, setRailVisible] = React.useState(() => {
    try { return localStorage.getItem('deck-stage.railVisible') !== '0'; } catch (e) { return true; }
  });
  const toggleRail = (on) => {
    setRailVisible(on);
    window.postMessage({ type: '__deck_rail_visible', on }, '*');
  };
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, window.location.origin);
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, window.location.origin);
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
          {hasDeckStage && railEnabled && !noDeckControls && (
            <TweakSection label="Deck">
              <TweakToggle label="Thumbnail rail" value={railVisible} onChange={toggleRail} />
            </TweakSection>
          )}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>

<script type="text/babel">
// data.jsx — sample data + helpers for Osmin habit tracker

const WEEKDAYS_ES = ['D', 'L', 'M', 'X', 'J', 'V', 'S']; // Dom, Lun, Mar, Mié, Jue, Vie, Sáb
const WEEKDAYS_LONG = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
const MONTHS_ES = [
  'Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio',
  'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre',
];

// Habit definitions for the demo month (Dec 2024)
// targetPerWeek: 1–7 (only for check habits, 7 = todos los días)
// goal: numeric daily target (only for numeric habits)
const DEFAULT_HABITS = [
  { id: 'gym',    label: 'GYM',     short: 'GYM',  type: 'check',   targetPerWeek: 3, color: '#1F8A5B' },
  { id: 'read',   label: 'Lectura', short: 'Read', type: 'check',   targetPerWeek: 7, color: '#7C5CD0' },
  { id: 'steps',  label: 'Pasos',   short: 'Steps',type: 'numeric', goal: 7000, unit: '', color: '#2A6FDB' },
  { id: 'leave',  label: 'Salir <19h', short: 'Out', type: 'check', targetPerWeek: 5, color: '#C97A2A' },
];

// Day status (highlight color, like the sketch: green = festivo, yellow = vacaciones)
// 'work' = laborable (default, no highlight)
const DAY_STATUS = {
  WORK: 'work',
  HOLIDAY: 'holiday',     // festivo (green)
  VACATION: 'vacation',   // vacaciones (yellow)
};

// Build December 2024 sample data, faithful to the user's handwritten sketch
function buildSampleMonth() {
  // Dec 1 2024 was a Sunday (weekday 0)
  const days = [];
  const total = 31;
  const firstWeekday = 0; // Sunday
  for (let i = 1; i <= total; i++) {
    const wd = (firstWeekday + i - 1) % 7;
    const isWeekend = wd === 0 || wd === 6;
    days.push({
      day: i,
      weekday: wd,
      status: isWeekend ? DAY_STATUS.HOLIDAY : DAY_STATUS.WORK,
      highlight: '',
      milestone: false,
      habits: { gym: 0, read: 0, steps: 0, leave: 0 },
    });
  }

  // Highlights from the sketch
  const set = (d, props) => Object.assign(days[d - 1], props);
  set(1,  { highlight: 'Sushito con Eve' });
  set(6,  { highlight: 'Finde pueblito — llegada' });
  set(7,  { highlight: 'Finde pueblito — Infantes + cena Coto', milestone: true });
  set(8,  { highlight: 'Finde pueblito — vuelta + Sushito' });
  set(9,  { highlight: 'Médico familia' });
  set(10, { highlight: 'Análisis sangre — LSH > 8 (de > 16)' });
  set(11, { highlight: 'Cena Max hacia Villran + consenso MC ingesta' });
  set(13, { highlight: 'Leadership + Black Star', milestone: true });
  set(14, { highlight: 'Serie "100 años de soledad" en Netflix' });
  set(15, { highlight: 'Cuidando a Eve con 40°' });
  set(16, { status: DAY_STATUS.VACATION, highlight: 'Endocrino — aumento a 100mg' });
  set(17, { status: DAY_STATUS.VACATION, highlight: 'Gripe — en moral' });
  set(18, { status: DAY_STATUS.VACATION, highlight: 'Gripe' });
  set(19, { status: DAY_STATUS.VACATION, highlight: 'Cenita navidad DATA + CRM', milestone: true });
  set(20, { status: DAY_STATUS.VACATION, highlight: 'Gripe — curso Google' });
  set(23, { status: DAY_STATUS.VACATION });
  set(26, { status: DAY_STATUS.VACATION, highlight: 'Río' });
  set(27, { status: DAY_STATUS.VACATION, highlight: 'Río' });
  set(30, { status: DAY_STATUS.VACATION, highlight: 'Río — Tamara loca con souvenir + IPA' });
  set(31, { status: DAY_STATUS.VACATION, highlight: 'Aperitivo + cenita nochevieja en moral', milestone: true });

  // Habit fills — patterns that look real (mostly hits weekdays, drops during gripe + río)
  const gymDays   = [2, 3, 4, 5, 9, 10, 11, 12, 13, 16];
  const readDays  = [1, 2, 4, 5, 6, 9, 11, 13, 14, 15, 22, 24, 27, 29];
  const leaveDays = [2, 3, 4, 5, 9, 10, 11, 12, 13, 16, 19];
  // Steps: weekdays around 7-10k, weekends 4-12k, gripe (17-20) low
  const steps = {
    1: 6800, 2: 8400, 3: 9200, 4: 7900, 5: 8800, 6: 11200, 7: 14600, 8: 9100,
    9: 8200, 10: 7600, 11: 9400, 12: 8900, 13: 10200, 14: 6300, 15: 5400,
    16: 7100, 17: 1800, 18: 1200, 19: 4400, 20: 2900, 21: 5600, 22: 7200,
    23: 6100, 24: 8400, 25: 9300, 26: 10800, 27: 11200, 28: 9600, 29: 8400,
    30: 12400, 31: 8900,
  };

  for (const d of gymDays)   days[d - 1].habits.gym = 1;
  for (const d of readDays)  days[d - 1].habits.read = 1;
  for (const d of leaveDays) days[d - 1].habits.leave = 1;
  for (const [d, v] of Object.entries(steps)) days[+d - 1].habits.steps = v;

  // Highlight Christmas eve/day as festivo
  set(24, { status: DAY_STATUS.HOLIDAY });
  set(25, { status: DAY_STATUS.HOLIDAY });

  return {
    year: 2024,
    month: 11, // Dec (0-indexed)
    habits: DEFAULT_HABITS,
    days,
    goals: [
      { id: 'g1', text: 'Cerrar Q4 con cena de equipo', done: true },
      { id: 'g2', text: 'Recuperar de la gripe antes de Navidad', done: true },
      { id: 'g3', text: 'Terminar curso Google PMP', done: false },
      { id: 'g4', text: 'Año Nuevo en el río con la familia', done: true },
      { id: 'g5', text: 'Leer 2 libros antes de fin de año', done: false },
    ],
  };
}

// Compute monthly stats for a habit
// For check habits, pct is measured against targetPerWeek (days/week target).
function habitStats(month, habit) {
  const days = month.days;
  if (habit.type === 'check') {
    const done = days.filter(d => d.habits[habit.id] === 1).length;
    const tpw = habit.targetPerWeek || 7;
    const expected = Math.max(1, Math.round((days.length / 7) * tpw));
    const pct = Math.min(100, Math.round((done / expected) * 100));
    return { done, total: days.length, expected, pct };
  }
  if (habit.type === 'numeric') {
    const hit = days.filter(d => (d.habits[habit.id] || 0) >= habit.goal).length;
    const sum = days.reduce((a, d) => a + (d.habits[habit.id] || 0), 0);
    return {
      done: hit, total: days.length,
      pct: Math.round((hit / days.length) * 100),
      avg: Math.round(sum / days.length),
      sum,
    };
  }
  return { done: 0, total: 0, pct: 0 };
}

// Longest current streak ending today (or end of month) for a habit
function habitStreak(month, habit) {
  const days = month.days;
  let best = 0, cur = 0;
  for (const d of days) {
    const v = d.habits[habit.id];
    const ok = habit.type === 'check' ? v === 1 : (v || 0) >= habit.goal;
    if (ok) { cur++; best = Math.max(best, cur); } else { cur = 0; }
  }
  return best;
}

// Cycle a check value 0 → 1 → -1 → 0 (-1 means "skipped intentionally")
function cycleCheck(v) {
  if (v === 0 || v === undefined) return 1;
  if (v === 1) return -1;
  return 0;
}

// Cycle day status work → holiday → vacation → work
function cycleStatus(s) {
  if (s === DAY_STATUS.WORK) return DAY_STATUS.HOLIDAY;
  if (s === DAY_STATUS.HOLIDAY) return DAY_STATUS.VACATION;
  return DAY_STATUS.WORK;
}

// Build a blank month, inheriting habits from the previous one
function buildBlankMonth(year, monthIdx, prevHabits) {
  const habits = (prevHabits || DEFAULT_HABITS).map(h => ({ ...h }));
  const firstWeekday = new Date(year, monthIdx, 1).getDay();
  const daysInMonth = new Date(year, monthIdx + 1, 0).getDate();
  const days = [];
  for (let i = 1; i <= daysInMonth; i++) {
    const wd = (firstWeekday + i - 1) % 7;
    const isWeekend = wd === 0 || wd === 6;
    const habitValues = {};
    for (const h of habits) habitValues[h.id] = 0;
    days.push({
      day: i,
      weekday: wd,
      status: isWeekend ? DAY_STATUS.HOLIDAY : DAY_STATUS.WORK,
      highlight: '',
      milestone: false,
      habits: habitValues,
    });
  }
  return { year, month: monthIdx, habits, days, goals: [] };
}

Object.assign(window, {
  WEEKDAYS_ES, WEEKDAYS_LONG, MONTHS_ES, DEFAULT_HABITS, DAY_STATUS,
  buildSampleMonth, buildBlankMonth, habitStats, habitStreak, cycleCheck, cycleStatus,
});

</script>

<script type="text/babel">
// table-layout.jsx — Layout A: faithful table view (rows = days, cols = habits)

function StatusBand({ status }) {
  const colors = {
    work: 'transparent',
    holiday: 'var(--c-festivo)',
    vacation: 'var(--c-vacaciones)',
  };
  return (
    <div style={{
      width: 6, alignSelf: 'stretch', borderRadius: 3,
      background: colors[status],
      opacity: status === 'work' ? 0 : 1,
    }} />
  );
}

function CheckCell({ value, color, onClick }) {
  // 0 = empty, 1 = done, -1 = skipped
  const fill = value === 1 ? color : 'transparent';
  const border = value === -1 ? 'var(--line-strong)' : (value === 1 ? color : 'var(--line)');
  return (
    <button
      onClick={onClick}
      className="osmin-cell"
      style={{
        width: 28, height: 28, borderRadius: 8,
        border: `1.5px solid ${border}`,
        background: fill,
        cursor: 'pointer', padding: 0,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        transition: 'all 120ms ease',
      }}
    >
      {value === 1 && (
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M3 7.5L5.8 10L11 4.5" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      )}
      {value === -1 && (
        <div style={{ width: 10, height: 1.5, background: 'var(--text-muted)' }} />
      )}
    </button>
  );
}

function NumericCell({ value, goal, color, onChange }) {
  const [editing, setEditing] = React.useState(false);
  const [draft, setDraft] = React.useState(String(value || ''));
  React.useEffect(() => setDraft(String(value || '')), [value, editing]);

  const pct = goal ? Math.min(1, value / goal) : 0;
  const hit = value >= goal && value > 0;

  const commit = () => {
    const n = parseInt(draft.replace(/[^\d]/g, ''), 10);
    onChange(isNaN(n) ? 0 : n);
    setEditing(false);
  };

  if (editing) {
    return (
      <input
        autoFocus
        value={draft}
        onChange={e => setDraft(e.target.value)}
        onBlur={commit}
        onKeyDown={e => { if (e.key === 'Enter') commit(); if (e.key === 'Escape') setEditing(false); }}
        style={{
          width: 60, height: 28, borderRadius: 8,
          border: `1.5px solid ${color}`, padding: '0 6px',
          fontFamily: 'JetBrains Mono, monospace', fontSize: 12,
          textAlign: 'center', background: 'var(--surface)',
          color: 'var(--text)', outline: 'none',
        }}
      />
    );
  }

  return (
    <button
      onClick={() => setEditing(true)}
      className="osmin-cell"
      style={{
        width: 60, height: 28, borderRadius: 8,
        border: `1.5px solid ${value > 0 ? color : 'var(--line)'}`,
        background: value > 0 ? `color-mix(in oklab, ${color} ${hit ? 18 : 8}%, transparent)` : 'transparent',
        cursor: 'pointer', padding: 0,
        position: 'relative', overflow: 'hidden',
        fontFamily: 'JetBrains Mono, monospace', fontSize: 11.5,
        fontVariantNumeric: 'tabular-nums',
        color: value > 0 ? 'var(--text)' : 'var(--text-muted)',
        fontWeight: hit ? 600 : 500,
      }}
    >
      <div style={{
        position: 'absolute', left: 0, bottom: 0, height: 2,
        width: `${pct * 100}%`, background: color, opacity: 0.5,
      }} />
      <span style={{ position: 'relative' }}>
        {value > 0 ? value.toLocaleString('es') : '—'}
      </span>
    </button>
  );
}

function TableLayout({ month, setMonth, density }) {
  const rowH = density === 'compact' ? 30 : 38;

  const _today = new Date();
  const todayDay = (month.year === _today.getFullYear() && month.month === _today.getMonth())
    ? _today.getDate() : null;

  const updateDay = (idx, mut) => {
    setMonth(m => {
      const next = { ...m, days: m.days.slice() };
      next.days[idx] = { ...next.days[idx], ...mut(next.days[idx]) };
      return next;
    });
  };
  const updateHabit = (idx, hid, val) => updateDay(idx, d => ({ habits: { ...d.habits, [hid]: val } }));

  return (
    <div style={{
      background: 'var(--surface)',
      border: '1px solid var(--line)',
      borderRadius: 14,
      overflow: 'hidden',
    }}>
      {/* Header row */}
      <div style={{
        display: 'grid',
        gridTemplateColumns: `64px 1fr ${month.habits.map(h => h.type === 'numeric' ? '76px' : '44px').join(' ')} 24px`,
        alignItems: 'center',
        gap: 8,
        padding: '10px 16px',
        borderBottom: '1px solid var(--line)',
        background: 'var(--surface-alt)',
        fontFamily: 'Inter, sans-serif',
        fontSize: 10.5,
        fontWeight: 600,
        color: 'var(--text-muted)',
        textTransform: 'uppercase',
        letterSpacing: '0.06em',
      }}>
        <div>Día</div>
        <div>Highlight</div>
        {month.habits.map(h => (
          <div key={h.id} style={{ textAlign: 'center', color: h.color }}>{h.short}</div>
        ))}
        <div></div>
      </div>

      {/* Day rows */}
      {month.days.map((d, idx) => {
        const wd = WEEKDAYS_ES[d.weekday];
        const isWeekend = d.weekday === 0 || d.weekday === 6;
        const isToday = d.day === todayDay;
        const stripeBg = isToday
          ? `color-mix(in oklab, var(--accent) 6%, var(--surface))`
          : idx % 2 === 0 ? 'var(--surface)' : 'var(--surface-alt)';
        return (
          <div
            key={d.day}
            style={{
              display: 'grid',
              gridTemplateColumns: `64px 1fr ${month.habits.map(h => h.type === 'numeric' ? '76px' : '44px').join(' ')} 24px`,
              alignItems: 'center',
              minHeight: rowH,
              padding: '0 16px',
              borderBottom: idx === month.days.length - 1 ? 'none' : `1px solid ${isToday ? 'color-mix(in oklab, var(--accent) 20%, var(--line-soft))' : 'var(--line-soft)'}`,
              borderTop: isToday ? `1px solid color-mix(in oklab, var(--accent) 20%, var(--line-soft))` : 'none',
              background: stripeBg,
              gap: 8,
            }}
          >
            {/* Day cell */}
            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
              <button
                onClick={() => updateDay(idx, d => ({ status: cycleStatus(d.status) }))}
                title="Cambiar estado del día"
                style={{
                  width: 26, height: 22, borderRadius: 6, padding: 0,
                  border: isToday ? '1.5px solid var(--accent)' : 'none',
                  cursor: 'pointer',
                  background: d.status === 'holiday' ? 'var(--c-festivo)' :
                              d.status === 'vacation' ? 'var(--c-vacaciones)' :
                              isToday ? `color-mix(in oklab, var(--accent) 14%, var(--surface))` : 'transparent',
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                  fontFamily: 'JetBrains Mono, monospace', fontSize: 12,
                  fontWeight: 600, fontVariantNumeric: 'tabular-nums',
                  color: d.status === 'work' ? (isToday ? 'var(--accent)' : 'var(--text)') : '#1a1a1a',
                }}
              >{d.day}</button>
              <span style={{
                fontFamily: 'JetBrains Mono, monospace', fontSize: 11,
                color: isWeekend ? 'var(--accent)' : 'var(--text-muted)',
                fontWeight: 500,
              }}>{wd}</span>
            </div>

            {/* Highlight */}
            <HighlightInput
              value={d.highlight}
              milestone={d.milestone}
              onChange={v => updateDay(idx, () => ({ highlight: v }))}
              onToggleMilestone={() => updateDay(idx, d => ({ milestone: !d.milestone }))}
            />

            {/* Habit cells */}
            {month.habits.map(h => (
              <div key={h.id} style={{ display: 'flex', justifyContent: 'center' }}>
                {h.type === 'check' ? (
                  <CheckCell
                    value={d.habits[h.id]}
                    color={h.color}
                    onClick={() => updateHabit(idx, h.id, cycleCheck(d.habits[h.id]))}
                  />
                ) : (
                  <NumericCell
                    value={d.habits[h.id] || 0}
                    goal={h.goal}
                    color={h.color}
                    onChange={v => updateHabit(idx, h.id, v)}
                  />
                )}
              </div>
            ))}

            {/* Status band */}
            <StatusBand status={d.status} />
          </div>
        );
      })}
    </div>
  );
}

function HighlightInput({ value, milestone, onChange, onToggleMilestone }) {
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 8, minWidth: 0 }}>
      <button
        onClick={onToggleMilestone}
        title="Marcar como hito del mes"
        style={{
          width: 18, height: 18, padding: 0, border: 'none',
          background: 'transparent', cursor: 'pointer',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          opacity: milestone ? 1 : 0.25,
          transition: 'opacity 120ms',
