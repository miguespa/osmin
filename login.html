<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Osmin — Acceder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #16161A;
  --surface: #1E1E22;
  --surface-alt: #232328;
  --text: #ECEAE4;
  --text-soft: #BFBDB6;
  --text-muted: #82807A;
  --line: #2C2C32;
  --line-soft: #26262B;
  --accent: #2A6FDB;
  --accent-glow: rgba(42,111,219,.22);
  --error: #E05252;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  min-height: 100vh;
  padding: 24px;
  background-image:
    linear-gradient(rgba(255,255,255,.022) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.022) 1px, transparent 1px);
  background-size: 32px 32px;
}

/* glow ambiental */
body::before {
  content: '';
  position: fixed; top: 20%; left: 50%; transform: translate(-50%,-50%);
  width: 600px; height: 400px;
  background: radial-gradient(ellipse, rgba(42,111,219,.1) 0%, transparent 68%);
  pointer-events: none;
}

/* ── CARD ── */
.card {
  width: 100%; max-width: 400px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 22px;
  padding: 40px 40px 36px;
  position: relative; overflow: hidden;
  box-shadow: 0 24px 64px rgba(0,0,0,.55);
  animation: cardIn .5s cubic-bezier(.3,.7,.4,1) forwards;
}
.card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
}
@keyframes cardIn {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}
.card.shake {
  animation: shake .4s cubic-bezier(.36,.07,.19,.97);
}
@keyframes shake {
  0%,100% { transform: translateX(0); }
  20%     { transform: translateX(-8px); }
  40%     { transform: translateX(8px); }
  60%     { transform: translateX(-5px); }
  80%     { transform: translateX(5px); }
}

/* ── LOGO ── */
.card-logo {
  display: flex; justify-content: center;
  margin-bottom: 32px;
}
.card-logo img {
  height: 32px; width: auto;
  filter: brightness(0) invert(1) opacity(.9);
}

/* ── HEADING ── */
.card-title {
  font-family: 'Instrument Serif', serif;
  font-size: 28px; font-weight: 400; line-height: 1.15;
  color: var(--text); text-align: center;
  margin-bottom: 8px; letter-spacing: -.015em;
}
.card-sub {
  font-size: 14px; color: var(--text-muted);
  text-align: center; margin-bottom: 32px; line-height: 1.5;
}

/* ── FORM ── */
.form-group { margin-bottom: 18px; }
label {
  display: block;
  font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600;
  color: var(--text-soft); letter-spacing: .04em;
  text-transform: uppercase; margin-bottom: 7px;
}
input[type="email"],
input[type="password"],
input[type="text"] {
  width: 100%; height: 44px;
  padding: 0 14px;
  background: var(--surface-alt);
  border: 1px solid var(--line);
  border-radius: 10px;
  color: var(--text);
  font-family: 'Inter', sans-serif; font-size: 14px;
  outline: none;
  transition: border-color 150ms, box-shadow 150ms;
  -webkit-appearance: none;
}
input::placeholder { color: var(--text-muted); }
input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}
input.error {
  border-color: var(--error);
  box-shadow: 0 0 0 3px rgba(224,82,82,.18);
}
.field-error {
  font-family: 'Inter', sans-serif; font-size: 12px;
  color: var(--error); margin-top: 6px;
  display: none;
}
.field-error.show { display: block; }

/* password toggle */
.pw-wrap { position: relative; }
.pw-toggle {
  position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
  background: none; border: none; cursor: pointer;
  color: var(--text-muted); padding: 4px;
  display: flex; align-items: center;
  transition: color 150ms;
}
.pw-toggle:hover { color: var(--text-soft); }

/* ── SUBMIT BUTTON ── */
.btn-submit {
  width: 100%; height: 48px;
  margin-top: 8px;
  background: var(--accent); color: #fff;
  border: none; border-radius: 10px;
  font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 600;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: background 150ms, transform 150ms, box-shadow 200ms;
}
.btn-submit:hover:not(:disabled) {
  background: #1f5cc4;
  transform: translateY(-1px);
  box-shadow: 0 6px 24px rgba(42,111,219,.4);
}
.btn-submit:disabled { opacity: .75; cursor: default; transform: none; }

.btn-submit .spinner {
  width: 16px; height: 16px;
  border: 2px solid rgba(255,255,255,.35);
  border-top-color: #fff;
  border-radius: 50%;
  display: none;
  animation: spin .65s linear infinite;
}
.btn-submit.loading .btn-text { display: none; }
.btn-submit.loading .spinner { display: block; }
@keyframes spin { to { transform: rotate(360deg); } }

/* success state */
.btn-submit.success { background: #1F8A5B; }
.btn-submit.success .btn-text { display: flex; align-items: center; gap: 6px; }

/* ── DIVIDER ── */
.divider {
  display: flex; align-items: center; gap: 12px;
  margin: 24px 0;
}
.divider::before, .divider::after {
  content: ''; flex: 1; height: 1px; background: var(--line);
}
.divider span {
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  color: var(--text-muted); letter-spacing: .08em;
  white-space: nowrap;
}

/* ── MOCK HINT ── */
.mock-hint {
  margin-top: 20px;
  padding: 10px 14px;
  background: rgba(42,111,219,.07);
  border: 1px solid rgba(42,111,219,.15);
  border-radius: 8px;
  font-family: 'JetBrains Mono', monospace; font-size: 10.5px;
  color: var(--text-muted); line-height: 1.5;
  text-align: center;
}
.mock-hint strong { color: rgba(42,111,219,.8); }

/* ── FOOTER ── */
.card-footer {
  margin-top: 28px;
  text-align: center;
  font-size: 13px; color: var(--text-muted);
}
.card-footer a {
  color: var(--text-soft); text-decoration: none;
  font-weight: 500;
  transition: color 150ms;
}
.card-footer a:hover { color: var(--text); }
.back-link {
  display: inline-flex; align-items: center; gap: 5px;
  position: absolute; top: -48px; left: 0;
  font-family: 'Inter', sans-serif; font-size: 13px;
  color: var(--text-muted); text-decoration: none;
  transition: color 150ms;
}
.back-link:hover { color: var(--text-soft); }

@media (max-width: 480px) {
  .card { padding: 32px 24px 28px; border-radius: 18px; }
}
</style>
</head>
<body>

<div style="position:relative; width:100%; max-width:400px;">
  <a href="landing-a.html" class="back-link">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <path d="M9 2.5L4.5 7 9 11.5"/>
    </svg>
    Volver al inicio
  </a>

  <div class="card" id="card">

    <div class="card-logo">
      <img src="logo.png" alt="Osmin">
    </div>

    <h1 class="card-title">Accede a tu espacio</h1>
    <p class="card-sub">Tu diario y hábitos te esperan.</p>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input
          type="email" id="email" name="email"
          placeholder="tu@email.com"
          autocomplete="email"
          spellcheck="false"
        >
        <p class="field-error" id="email-err">Introduce un correo válido.</p>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="pw-wrap">
          <input
            type="password" id="password" name="password"
            placeholder="••••••••"
            autocomplete="current-password"
          >
          <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Mostrar contraseña">
            <svg id="eye-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
              <path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5z"/>
              <circle cx="8" cy="8" r="2"/>
            </svg>
          </button>
        </div>
        <p class="field-error" id="pw-err">Introduce tu contraseña.</p>
      </div>

      <button type="submit" class="btn-submit" id="submit-btn">
        <span class="btn-text">
          Entrar
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <path d="M2 6.5h9M7 2.5l4 4-4 4"/>
          </svg>
        </span>
        <div class="spinner"></div>
      </button>
    </form>

    <div class="mock-hint">
      <strong>Prototipo</strong> — cualquier email y contraseña funcionan
    </div>

    <div class="divider"><span>o</span></div>

    <div class="card-footer">
      ¿Primera vez? <a href="landing-a.html#pricing">Es completamente gratis →</a>
    </div>
  </div>
</div>

<script>
const form     = document.getElementById('login-form');
const card     = document.getElementById('card');
const emailEl  = document.getElementById('email');
const pwEl     = document.getElementById('password');
const emailErr = document.getElementById('email-err');
const pwErr    = document.getElementById('pw-err');
const submitBtn= document.getElementById('submit-btn');
const pwToggle = document.getElementById('pw-toggle');
const eyeIcon  = document.getElementById('eye-icon');

// Password visibility toggle
let pwVisible = false;
pwToggle.addEventListener('click', () => {
  pwVisible = !pwVisible;
  pwEl.type = pwVisible ? 'text' : 'password';
  eyeIcon.innerHTML = pwVisible
    ? `<path d="M2 2l12 12M6.5 6.6A2 2 0 0 0 9.4 9.5M4.2 4.3C2.5 5.5 1 8 1 8s2.5 5 7 5c1.4 0 2.7-.4 3.8-1M6 3.1C6.6 3 7.3 3 8 3c4.5 0 7 5 7 5s-.6 1.2-1.5 2.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>`
    : `<path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5z"/><circle cx="8" cy="8" r="2"/>`;
});

// Clear errors on input
emailEl.addEventListener('input', () => {
  emailEl.classList.remove('error');
  emailErr.classList.remove('show');
});
pwEl.addEventListener('input', () => {
  pwEl.classList.remove('error');
  pwErr.classList.remove('show');
});

// Submit
form.addEventListener('submit', (e) => {
  e.preventDefault();

  const email    = emailEl.value.trim();
  const password = pwEl.value;
  let hasError   = false;

  // Validate: non-empty email
  if (!email) {
    emailEl.classList.add('error');
    emailErr.classList.add('show');
    hasError = true;
  }

  // Validate: non-empty password
  if (!password) {
    pwEl.classList.add('error');
    pwErr.classList.add('show');
    hasError = true;
  }

  if (hasError) {
    card.classList.remove('shake');
    void card.offsetWidth; // reflow to retrigger
    card.classList.add('shake');
    return;
  }

  // Persist email for session
  localStorage.setItem('osmin_user_email', email);

  // Loading state
  submitBtn.classList.add('loading');
  submitBtn.disabled = true;

  // Brief success flash then redirect
  setTimeout(() => {
    submitBtn.classList.remove('loading');
    submitBtn.classList.add('success');
    submitBtn.querySelector('.btn-text').innerHTML = `
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2.5 7.5L6 11l6.5-7"/>
      </svg>
      Entrando…
    `;
  }, 800);

  setTimeout(() => {
    window.location.href = 'Osmin.html';
  }, 1300);
});
</script>
</body>
</html>
